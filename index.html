function lose(){state='loss';hold=false;$('hud').hidden=true;$('loss').hidden=false;$('rematch').hidden=true;clean=toes.map(()=>5);els.forEach(el=>{el.textContent='5';el.classList.remove('done')});$('cleanCount').textContent='0 / 10 toes clean';brush.style.display='none';prev=null;brushing=false;lastScrub=0}

wrap.addEventListener('pointerdown',e=>{if(state!=='loss')return;e.preventDefault();wrap.setPointerCapture(e.pointerId);brushing=true;prev=null;scrub(e)});wrap.addEventListener('pointermove',e=>{if(brushing){e.preventDefault();scrub(e)}});for(let ev of ['pointerup','pointercancel','lostpointercapture'])wrap.addEventListener(ev,()=>{brushing=false;prev=null});$('start').onclick=start;$('rematch').onclick=start;$('menuAgain').onclick=()=>{state='menu';$('loss').hidden=true;$('menu').hidden=false;$('hud').hidden=true};
</script></body></html>
