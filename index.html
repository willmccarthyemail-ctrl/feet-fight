const $=id=>document.getElementById(id),app=$('app'),modal=$('modal');
const chapters=[
{title:'An Unexpected Dinner',course:'Prologue • The preparation',scene:'dinner',caption:'Misty Mountain • Dusk',story:'The table is laid for a legendary dinner. Yet the plates are empty, the hearth is cold, and a sinister curse has sealed the pantry. The Grey Wizard arrives with a warning: every course must be earned.',speaker:'THE GREY WIZARD',line:'First, prepare the meat. The kitchen obeys wisdom, not swords.',reward:'Butcher’s knife',q:[{r:'I have a blade but no life. I divide what is whole, yet never eat a bite. What am I?',a:['A fork','A knife','A candle','A plate'],c:1,h:'A cook uses me to slice.',why:'The enchanted knife unlocks the butcher’s block.'},{r:'Before cooking, the steak must be prepared. Which action removes surface moisture so the meat can brown?',a:['Pat it dry','Soak it in water','Cover it in ice','Boil it first'],c:0,h:'Water must evaporate before browning begins.',why:'The steak is ready for a proper sear.'}]},
{title:'The Butcher’s Covenant',course:'Chapter I • The meat',scene:'butcher',caption:'The cursed butcher shop',story:'A hulking toe-headed butcher guards a magnificent tomahawk steak. He will surrender it only to a worthy cook.',speaker:'THE BUTCHER',line:'Name my secret, little traveler, or your dinner is doomed!',reward:'Tomahawk steak',q:[{r:'I come from the sea, yet I am not a fish. A little of me makes a feast more delicious; too much ruins it. What am I?',a:['Pepper','Salt','Sugar','Flour'],c:1,h:'I am made of tiny crystals.',why:'The butcher slides a bowl of salt across the counter.'},{r:'The butcher weighs two steaks. Together they weigh 48 ounces. One is twice as heavy as the other. How heavy is the larger steak?',a:['24 ounces','36 ounces','32 ounces','16 ounces'],c:2,h:'Divide 48 into three equal parts; the larger steak takes two.',why:'The mighty tomahawk is yours.'}]},
{title:'The Cellar of Whispers',course:'Chapter II • The wine',scene:'cellar',caption:'Beneath the mountain',story:'You descend into a cellar of ancient barrels. A goblin sommelier blocks the stairs, clutching the key to a bottle reserved for the feast.',speaker:'THE SOMMELIER',line:'I collect secrets, not coin. Answer me and the vintage is yours.',reward:'Magnum of wine',q:[{r:'What grows older without breathing, sleeps in darkness, and can be opened but never made young again?',a:['A stone','A window','An aged wine','A loaf of bread'],c:2,h:'It rests in a cellar.',why:'The goblin bows and presents the magnum.'},{r:'Three guests share a 1.5-liter magnum equally. How much wine does each receive?',a:['250 mL','750 mL','1 liter','500 mL'],c:3,h:'1.5 liters is 1,500 milliliters.',why:'The cellar door opens with a heavy groan.'}]},
{title:'The Bridge of Embers',course:'Chapter III • The fire',scene:'bridge',caption:'The abyss of the foot lords',story:'An enormous foot dragon coils around a stone bridge. Beyond it lies the only flame hot enough to light the enchanted kitchen.',speaker:'THE FOOT DRAGON',line:'YOU SHALL NOT PASS... unless you understand fire!',reward:'Ember of the mountain',q:[{r:'Feed me and I live; give me water and I die. I have no mouth, yet I consume. What am I?',a:['A dragon','Fire','A tree','A shadow'],c:1,h:'I give heat and light.',why:'The dragon lowers its wings.'},{r:'Four torches burn on the bridge. You extinguish two. After the other two burn away completely, how many torches remain?',a:['None','Four','Two','One'],c:2,h:'The extinguished torches do not burn away.',why:'You carry two torches and the sacred ember onward.'}]},
{title:'A Supper Before Supper',course:'Chapter IV • The appetizer',scene:'appetizer',caption:'The forest tavern',story:'A lonely goblin innkeeper serves a platter of oysters, shrimp and mushrooms. The wizard joins you for a small appetizer before the climb.',speaker:'THE INNKEEPER',line:'Choose wisely. The first course must awaken the palate, not end the feast.',reward:'Silver appetizer plate',q:[{r:'I have a shell but no legs, live in the sea, and sometimes hide a pearl. What am I?',a:['A crab','An oyster','A mushroom','A shrimp'],c:1,h:'I am a bivalve.',why:'The oyster platter is served.'},{r:'I am one of the five basic tastes. Mushrooms, aged cheese and meat are rich in me. What am I?',a:['Sour','Sweet','Umami','Bitter'],c:2,h:'I am the savory taste.',why:'The wizard raises his cup to the savory mysteries.'}]},
{title:'The Two Foot Lords',course:'Chapter V • The main course',scene:'boss',caption:'The kitchen of the damned',story:'The Black Mark and the Red Stomper rise from beneath the kitchen floor. They threaten to steal your tomahawk. Only the ancient laws of the hearth can banish them.',speaker:'THE BLACK MARK',line:'Your steak belongs to us! Prove you know the kitchen’s secrets.',reward:'The feast’s golden key',q:[{r:'I disappear when you say my name. What am I?',a:['Silence','Darkness','Hunger','Steam'],c:0,h:'Speaking breaks me.',why:'Silence falls. The Black Mark retreats.'},{r:'I am taken from the fire, then left alone. My juices settle before I am cut. What stage of cooking is this?',a:['Marinating','Freezing','Resting','Seasoning'],c:2,h:'Give the steak a few minutes after cooking.',why:'The Red Stomper crumbles into smoke. The golden key appears.'}]},
{title:'The Feast of Middle Girth',course:'Chapter VI • Dinner is served',scene:'main',caption:'The great banquet hall',story:'At last, the tomahawk steak is served beneath the vaulted ceiling. Wine glows in the candlelight. The wizard tells you one final tale before dessert.',speaker:'THE GREY WIZARD',line:'A great meal is never truly finished until the final sweet mystery is solved.',reward:'Banquet medallion',q:[{r:'The feast begins at seven. Each of three courses takes 25 minutes, with a 10-minute break between courses. When does the third course end?',a:['8:15','8:25','8:35','8:45'],c:2,h:'75 minutes of courses plus two 10-minute breaks.',why:'The clock strikes 8:35. Time for dessert.'},{r:'What can be shared among a table of friends without becoming smaller?',a:['A steak','A bottle','A story','A slice of cake'],c:2,h:'It is told rather than eaten.',why:'Laughter fills the hall as the wizard finishes his story.'}]},
{title:'The Last Sweet Mystery',course:'Final chapter • Dessert',scene:'dessert',caption:'The celestial pastry vault',story:'A golden door opens into a moonlit dessert room. Chocolate, berries and a towering cake await. The final guardian, the Sugar Wraith, demands two answers before the curse is lifted forever.',speaker:'THE SUGAR WRAITH',line:'Solve my final riddles and the feast is yours for eternity.',reward:'The crown of the eternal feast',q:[{r:'I have layers, but I am not the earth. I wear frosting instead of clothes. I am cut to celebrate. What am I?',a:['A candle','A cake','A pancake','An apple'],c:1,h:'Birthdays often feature me.',why:'The cake reveals a glowing crown.'},{r:'You cut a round cake with three straight vertical cuts from top to bottom, without moving or stacking any pieces. What is the greatest number of pieces you can make?',a:['Six','Eight','Seven','Nine'],c:2,h:'The third cut can cross the first two at different points.',why:'Seven perfect pieces. The Sugar Wraith vanishes. The feast is complete!'}]}

const KEY='middleGirthFeast_v1',SCORES='middleGirthFeast_scores_v1';let state=null,screen='home';const fresh=()=>({chapter:0,q:0,score:0,wits:3,items:[],hints:0,wrong:[],hint:false,answered:false,phase:'story',saved:false});function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}function save(){write(KEY,state)}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function panel(scene,cap){return `<div class="art">${art(scene)}<span class="caption">${esc(cap)}</span></div>`}function top(){return `<div class="stats"><div class="stat">Chapter<strong>${state.chapter+1} / ${chapters.length}</strong></div><div class="stat">Insight<strong>${'◆'.repeat(state.wits)}${'◇'.repeat(3-state.wits)}</strong></div><div class="stat">Score<strong>${state.score}</strong></div></div><div class="track" aria-label="Chapter progress">${chapters.map((_,i)=>`<i class="${i<state.chapter?'done':i===state.chapter?'now':''}"></i>`).join('')}</div>`}function inventory(){return `<div class="inventory"><b>Satchel:</b> ${state.items.length?state.items.map(esc).join(' • '):'Empty'}</div>`}function show(html,scroll=true){app.innerHTML=`<div class="fade">${html}</div>`;if(scroll)window.scrollTo(0,0)}function home(){screen='home';const saved=read(KEY,null);show(`<div class="cover"><div class="eyebrow" style="color:#d8b77b">An illustrated riddle adventure</div><h1><small>The Battle for</small>Middle Girth</h1><p class="sub">The Last Feast</p>${panel('dinner','The table awaits')}<div class="paper"><h2>Eight chapters. Sixteen mysteries. One legendary meal.</h2><p>Enter the cursed kitchen, challenge the foot lords, gather ingredients and unlock the final dessert. Every answer brings the feast closer.</p></div>${saved&&saved.phase!=='victory'?'<button class="primary" id="resume">Continue your story</button>':''}<button class="${saved&&saved.phase!=='victory'?'secondary':'primary'}" id="start">Begin a new dinner</button><button class="secondary" id="scores">Hall of legends</button><p class="footnote">Made for portrait iPhone play • No controller • Progress saved on this device</p></div>`);$('start').onclick=()=>{if(saved&&saved.phase!=='victory'){dialog('Start a new dinner?','Your current journey will be replaced.',()=>{state=fresh();save();render()});return}state=fresh();save();render()};if($('resume'))$('resume').onclick=()=>{state=saved;render()};$('scores').onclick=()=>leader(false)}function render(scroll=true){screen='game';if(state.phase==='victory'){victory();return}const ch=chapters[state.chapter],q=ch.q[state.q];let html=top()+panel(ch.scene,ch.caption);if(state.phase==='story'){html+=`<section class="paper"><div class="eyebrow">${ch.course}</div><h2>${ch.title}</h2><p>${ch.story}</p><div class="speech"><b>${ch.speaker}</b>${ch.line}</div></section><button class="primary" id="next">${state.chapter===0?'Prepare the meat':'Face the challenge'}</button>`}else if(state.phase==='reward'){html+=`<section class="paper"><div class="eyebrow">Chapter complete</div><h2>${ch.reward}</h2><p>${state.chapter===7?'The final mystery has been solved. The feast is yours!':'Your reward has been placed in the satchel. The next course awaits.'}</p><div class="speech"><b>THE GREY WIZARD</b>${state.chapter===7?'A meal worth every riddle.':'Well done. The mountain remembers your wisdom.'}</div></section><button class="primary" id="next">${state.chapter===7?'Enter the eternal feast':'Continue the journey'}</button>`}else{html+=`<section class="paper"><div class="eyebrow">${ch.course} • Riddle ${state.q+1} of ${ch.q.length}</div><h2>${ch.title}</h2><p class="question">${q.r}</p><div class="answers">${q.a.map((a,i)=>`<button class="answer ${state.wrong.includes(i)?'wrong':''} ${state.answered&&i===q.c?'right':''}" data-i="${i}" ${state.answered||state.wrong.includes(i)?'disabled':''}><span>${'ABCD'[i]}</span>${esc(a)}</button>`).join('')}</div>${!state.answered?`<button class="hint" id="hint" ${state.hint?'disabled':''}>${state.hint?'Hint revealed':'Reveal a hint (−15 points)'}</button>`:''}${state.hint?`<p class="small">Hint: ${q.h}</p>`:''}<div class="feedback ${state.answered?'good':'bad'}" role="status">${state.answered?q.why:state.wrong.length?'Not quite. Try another answer. '+(state.wits===0?'Your insight is exhausted; keep solving to recover.':'−1 insight, −20 points.'):''}</div></section>${state.answered?'<button class="primary" id="next">Turn the page</button>':''}`};html+=inventory();show(html,scroll);if($('next'))$('next').onclick=advance;if($('hint'))$('hint').onclick=()=>{state.hint=true;state.hints++;state.score=Math.max(0,state.score-15);save();render(false)};document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(+b.dataset.i))}function answer(i){if(state.answered||state.wrong.includes(i))return;const q=chapters[state.chapter].q[state.q];if(i===q.c){state.answered=true;state.score+=state.wrong.length?60:100;if(!state.wrong.length&&!state.hint)state.wits=Math.min(3,state.wits+1)}else{state.wrong.push(i);state.wits=Math.max(0,state.wits-1);state.score=Math.max(0,state.score-20)}save();render(false)}function advance(){if(state.phase==='story'){state.phase='riddle'}else if(state.phase==='reward'){if(state.chapter===chapters.length-1){state.phase='victory'}else{state.chapter++;state.q=0;state.phase='story'}}else if(state.answered){if(state.q+1<chapters[state.chapter].q.length){state.q++}else{state.items.push(chapters[state.chapter].reward);state.score+=50;state.phase='reward'}}state.wrong=[];state.hint=false;state.answered=false;save();render()}function victory(){screen='victory';show(`${panel('victory','The eternal feast')}<section class="paper"><div class="eyebrow">The end • Dessert completed</div><h2>Champion of the Last Feast</h2><p>The curse is broken. You and the wizard raise a glass over a table of steaks, wine and sweet delicacies. Every guardian is defeated, every plate is full.</p><div class="speech"><b>THE GREY WIZARD</b>To wisdom, friendship, and a magnificent dinner!</div><p><strong>Final score: ${state.score}</strong> • ${state.hints} hints used</p>${!state.saved?'<form id="scoreform"><label for="name">Enter your name in the Hall of Legends</label><input id="name" maxlength="18" required placeholder="Your name" autocomplete="nickname"><button class="primary" type="submit">Record your score</button></form>':'<button class="primary" id="scores">Hall of legends</button>'}</section><button class="secondary" id="home">Return to title</button>`);$('home').onclick=home;if($('scores'))$('scores').onclick=()=>leader(true);if($('scoreform'))$('scoreform').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim();if(!name)return;let rows=read(SCORES,[]);rows.push({name,score:state.score});rows.sort((a,b)=>b.score-a.score);write(SCORES,rows.slice(0,10));state.saved=true;save();leader(true)}}function leader(back){screen='scores';let rows=read(SCORES,[]);show(`${panel('main','The hall of legends')}<section class="paper"><div class="eyebrow">The finest minds of Middle Girth</div><h2>Hall of Legends</h2><table class="scorelist"><thead><tr><th>Rank</th><th>Name</th><th>Score</th></tr></thead><tbody>${rows.length?rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.score}</td></tr>`).join(''):'<tr><td colspan="3">No recorded feasts yet.</td></tr>'}</tbody></table><p class="small">High scores are stored on this device.</p></section><button class="primary" id="home">${back?'Return to feast':'Return to title'}</button>`);$('home').onclick=back?victory:home}function dialog(title,body,yes){modal.hidden=false;modal.innerHTML=`<section class="paper" role="dialog" aria-modal="true"><h2>${title}</h2><p>${body}</p><button class="primary" id="yes">Confirm</button><button class="secondary" id="no">Cancel</button></section>`;$('yes').onclick=()=>{modal.hidden=true;yes()};$('no').onclick=()=>modal.hidden=true} $('menuBtn').onclick=()=>{if(screen==='home')return;dialog('Return to title?','Your story progress is saved automatically.',home)};home();
</script></body></html>
